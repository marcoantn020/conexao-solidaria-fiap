apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-doacoes
  labels:
    app: worker-doacoes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-doacoes
  template:
    metadata:
      labels:
        app: worker-doacoes
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - until pg_isready -h postgres-doacoes -p 5432; do echo waiting for postgres-doacoes; sleep 2; done
      containers:
        - name: worker-doacoes
          image: worker-doacoes:local
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: worker-doacoes-config
            - secretRef:
                name: worker-doacoes-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
