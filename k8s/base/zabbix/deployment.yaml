apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix
  labels:
    app: zabbix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix
  template:
    metadata:
      labels:
        app: zabbix
    spec:
      containers:
        - name: zabbix
          image: zabbix/zabbix-appliance:alpine-4.4-latest
          ports:
            - containerPort: 80
              name: web
            - containerPort: 10051
              name: server
