version: "3.9"

services:
  postgres-campanhas:
    image: postgres:16
    environment:
      POSTGRES_DB: campanhas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-campanhas-data:/var/lib/postgresql/data

  postgres-doacoes:
    image: postgres:16
    environment:
      POSTGRES_DB: doacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-doacoes-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-campanhas-data:
  postgres-doacoes-data:
