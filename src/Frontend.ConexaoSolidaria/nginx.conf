server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy para a Api.CampanhasUsuarios dentro do cluster -- o navegador não
    # resolve o DNS interno "api-campanhas-usuarios", então o nginx repassa
    # em nome dele. O "/" final em proxy_pass remove o prefixo /api/. O nome
    # resolve via o /etc/resolv.conf do próprio pod (CoreDNS), o mesmo
    # mecanismo que já resolve "postgres-campanhas"/"rabbitmq" para os
    # outros serviços -- só não resolve fora do cluster (ex.: `docker run`
    # standalone), o que é esperado.
    location /api/ {
        proxy_pass http://api-campanhas-usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: qualquer rota que não seja um arquivo estático cai no index.html
    # para o Blazor Router assumir a navegação client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
